[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-failure-periodic-table"
version = "1.5.3"
description = "343-class structural taxonomy of AI failure mechanisms with keyword classifier and semantic search"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "R. Gatoloai-Faupula", email = "ryangat@lmlsystemlayer.com" }]
keywords = ["ai", "safety", "taxonomy", "classification", "failure-modes"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["snowballstemmer>=2.2"]

[project.urls]
Homepage = "https://lml-layer-system.github.io/ai-failure-periodic-table/"
Repository = "https://github.com/lml-layer-system/ai-failure-periodic-table"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp>=1.2"]
api = ["fastapi>=0.100", "uvicorn>=0.20", "slowapi>=0.1.9"]

[project.scripts]
ai-failure-table = "src.cli:main"
ai-failure-mcp = "src.ai_failure_mcp.server:main"
ai-failure-api = "src.ai_failure_api.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["data/*.json", "py.typed"]

# macOS / network volumes may litter AppleDouble files (._*); never ship them.
[tool.setuptools.exclude-package-data]
src = ["._*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
